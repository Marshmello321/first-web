<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Support Page</title>
    <!-- Importing the Montserrat font for a premium look on the buttons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Smooth, dark background to make the charcoal card pop */
            background: linear-gradient(135deg, #0d0f12, #1a1d24);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 900px;
            width: 100%;
            /* Rich charcoal grey background */
            background: #22252a;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            /* A subtle vibrant green top border for that gaming aesthetic */
            border-top: 4px solid #00d26a; 
            overflow: hidden;
        }

        /* LEFT PANEL - Seamless integration, no harsh borders */
        .left-panel {
            flex: 1;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.15); /* Slightly darker to separate naturally */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            /* Vibrant green border to match the aesthetic */
            border: 3px solid #00d26a; 
            object-fit: cover;
            margin-bottom: 20px;
            background-color: #111; 
        }

        .channel-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .description-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            border-radius: 12px;
            font-size: 14px;
            color: #b5b5b5;
            line-height: 1.6;
        }

        /* RIGHT PANEL */
        .right-panel {
            flex: 2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            margin-bottom: 25px;
            font-size: 22px;
            color: #ffffff;
            font-weight: 600;
        }

        /* TIERS */
        .tiers {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
        }

        .tier-btn {
            flex: 1;
            padding: 15px 5px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            /* Applying the custom professional font here */
            font-family: 'Montserrat', sans-serif; 
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            color: #111;
        }

        .tier-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Modern, matte metallic gradients */
        .silver { background: linear-gradient(135deg, #d3d3d3, #a9a9a9); }
        .gold { background: linear-gradient(135deg, #fceabb, #f8b500); }
        .diamond { background: linear-gradient(135deg, #89f7fe, #66a6ff); }

        /* CUSTOM AMOUNT SECTION */
        .custom-amount-wrapper {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .custom-input {
            flex: 2;
            padding: 12px 15px;
            background: #191b1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .custom-input:focus {
            border-color: #00d26a;
        }

        .custom-btn {
            flex: 1;
            background: #00d26a; /* Vibrant green */
            color: #111;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .custom-btn:hover {
            background: #00e676;
        }

        /* QR DISPLAY AREA */
        .qr-display {
            background: #191b1f;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        #qr-instruction {
            color: #00d26a; /* Accented text */
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
        }

        #qr-image {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            margin: 0 auto;
            background-color: white;
            padding: 10px;
        }

        .upi-id {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }

        /* SOCIAL LINKS */
        .social-links {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .social-btn {
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
            text-align: center;
            min-width: 130px;
            font-size: 14px;
        }

        .yt { background-color: #e52d27; }
        .yt:hover { background-color: #b31217; }
        .insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .insta:hover { filter: brightness(1.1); }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <img src="my-logo.png" alt="Logo" class="logo">
            <div class="channel-name">Your Channel Name</div>
            <div class="description-box">
                Creating high-energy challenge videos, 3D animations, and entertaining content. Thank you for supporting the channel!
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <h3 class="section-title">Support My Work</h3>
            
            <!-- Standard Tiers -->
            <div class="tiers">
                <button class="tier-btn silver" onclick="generateQR(49, 'Silver')">SILVER<br>₹49</button>
                <button class="tier-btn gold" onclick="generateQR(249, 'Gold')">GOLD<br>₹249</button>
                <button class="tier-btn diamond" onclick="generateQR(500, 'Diamond')">DIAMOND<br>₹500</button>
            </div>

            <!-- Custom Amount Generator -->
            <div class="custom-amount-wrapper">
                <input type="number" id="custom-amount" class="custom-input" placeholder="Enter custom amount (₹)" min="1">
                <button class="custom-btn" onclick="generateCustomQR()">Generate</button>
            </div>

            <!-- QR Code Display -->
            <div class="qr-display">
                <p id="qr-instruction">Select a tier or enter amount</p>
                <img id="qr-image" src="" alt="Payment QR Code" style="display: none;">
                <div class="upi-id">UPI ID: <strong id="display-upi">yourname@upi</strong></div>
            </div>

            <!-- Socials -->
            <div class="social-links">
                <a href="YOUR_INSTA_LINK" class="social-btn insta">INSTAGRAM</a>
                <a href="YOUR_YT_LINK" class="social-btn yt">YOUTUBE</a>
            </div>
        </div>
    </div>

    <script>
        // --- IMPORTANT: UPDATE THESE TWO LINES ---
        const MY_UPI_ID = "yourname@upi"; 
        const MY_NAME = "Your Name";      
        // -----------------------------------------

        function generateQR(amount, tierName) {
            const qrImage = document.getElementById("qr-image");
            const qrInstruction = document.getElementById("qr-instruction");
            const upiText = document.getElementById("display-upi");
            
            const upiLink = `upi://pay?pa=${MY_UPI_ID}&pn=${MY_NAME}&am=${amount}&cu=INR`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiLink)}`;
            
            qrImage.src = qrApiUrl;
            qrImage.style.display = "block";
            qrInstruction.innerText = `${tierName} Tier - Scan to pay ₹${amount}`;
            upiText.innerText = MY_UPI_ID;
        }

        // New function specifically for the custom amount box
        function generateCustomQR() {
            const amountInput = document.getElementById("custom-amount").value;
            
            // Checks if the user actually typed a valid number before generating
            if(amountInput && amountInput > 0) {
                generateQR(amountInput, "Custom");
            } else {
                alert("Please enter a valid amount.");
            }
        }
    </script>

</body>
</html>
