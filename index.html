<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Support Page</title>
    <style>
        body {
            /* A dark, modern background */
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .profile-card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #007BFF;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .bio {
            color: #b3b3b3;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .link-btn {
            display: block;
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: bold;
        }
        .link-btn:hover {
            background-color: #007BFF;
        }
        .qr-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        .qr-image {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 1. Profile Picture / Logo -->
        <img src="https://via.placeholder.com/150" alt="My Logo" class="profile-img">
        
        <!-- 2. Name and Description -->
        <h2>My Creator Name</h2>
        <p class="bio">Welcome to my page! I create high-energy gaming challenges, custom 3D animations, and entertaining content. Thank you for the support!</p>

        <!-- 3. Social Links -->
        <a href="YOUR_YOUTUBE_LINK_HERE" class="link-btn">Subscribe on YouTube</a>
        <a href="YOUR_INSTAGRAM_LINK_HERE" class="link-btn">Follow on Instagram</a>
        
        <!-- 4. QR Code Section -->
        <div class="qr-section">
            <h3>Support My Work</h3>
            <p style="font-size: 14px; color: #b3b3b3;">Scan to tip via UPI / App</p>
            <img src="https://via.placeholder.com/150" alt="Payment QR Code" class="qr-image">
        </div>
    </div>

</body>
</html>
